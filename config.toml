theme = "catppuccin_mocha"

[editor]
auto-completion = true
auto-pairs = true
auto-save = true
auto-format = true
auto-info = true
color-modes = true
completion-trigger-len = 2
cursorline = true
continue-comments = true
gutters = ["diff", "diagnostics", "line-numbers", "spacer"]
line-number = "relative"
mouse = true
popup-border = "all"
path-completion = true
scroll-lines = 3
scrolloff = 5
shell = ["fish", "-c"]
true-color = true
end-of-line-diagnostics = "hint"

[editor.statusline]
left = [
  "mode",
  "spinner",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
]
center = []
right = ["diagnostics", "selections", "register", "position", "file-encoding"]
mode.normal = "N"
mode.insert = "I"
mode.select = "S"

[editor.lsp]
enable = true
display-inlay-hints = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.file-picker]
hidden = false

[editor.smart-tab]
enable = true

[editor.inline-diagnostics]
cursor-line = "warning" # show warnings and errors on the cursorline inline

[keys.normal]
tab = "move_parent_node_end" # related to smart-tab
S-tab = "move_parent_node_start" # related to smart-tab

[keys.normal.space]
e = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file',
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

[keys.normal.space.b]
b = "buffer_picker"
d = ":buffer-close"
D = ":buffer-close-others"
n = ":buffer-next"
p = ":buffer-previous"

[keys.insert]
S-tab = "move_parent_node_start" # related to smart-tab
"S-ret" = ["open_below", "insert_mode"] # Maps the enter key to open_below then re-enter normal mode

[keys.select]
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"
