theme = "catppuccin_mocha"

[editor]
auto-completion = true
auto-format = true
auto-info = true
auto-pairs = true
auto-save = true
color-modes = true
completion-trigger-len = 1
continue-comments = true
cursorline = true
default-yank-register = "+"
end-of-line-diagnostics = "warning"
gutters = ["diff", "diagnostics", "line-numbers", "spacer"]
line-number = "relative"
mouse = true
path-completion = true
popup-border = "all"
scroll-lines = 3
scrolloff = 5
shell = ["fish", "-c"]
true-color = true
clipboard-provider = "pasteboard"

[editor.statusline]
left = [
  "mode",
  "spinner",
  "file-base-name",
  "version-control",
  "read-only-indicator",
  "file-modification-indicator",
]
center = ["position-percentage"]
right = ["diagnostics", "selections", "register", "position", "file-encoding"]
mode.normal = "N"
mode.insert = "I"
mode.select = "S"

[editor.lsp]
enable = true
display-inlay-hints = true
goto-reference-include-declaration = true
auto-signature-help = true
display-signature-help-docs = true
snippets = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

[editor.file-picker]
hidden = false

[editor.smart-tab]
enable = true

[editor.inline-diagnostics]
cursor-line = "warning" # show warnings and errors on the cursorline inline

[keys.normal]
tab = "move_parent_node_end"     # related to smart-tab
S-tab = "move_parent_node_start" # related to smart-tab
"`" = "switch_to_uppercase"
"A-`" = "switch_to_lowercase"
C-s = [":format", ":write"]

[keys.normal.space]
e = [
  ":sh rm -f /tmp/unique-file",
  ":insert-output yazi %{buffer_name} --chooser-file=/tmp/unique-file",
  ':insert-output echo "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ":open %sh{cat /tmp/unique-file}",
  ":redraw",
]
"," = "buffer_picker"
esc = ":config-reload"

[keys.normal.space.i]
d = ":append-output date +%%Y-%%m-%%d"

[keys.normal.space.b]
q = ":buffer-close"
Q = ":buffer-close!"

[keys.normal."]"]
b = ":buffer-next"
w = "jump_view_right"

[keys.normal."["]
b = ":buffer-previous"
w = "jump_view_left"

# build easifem
[keys.normal."+"]
# b = [":run-shell-command easifem dev base -q", ":run-shell-command easifem install base -q --no-download"]
# c= [":run-shell-command easifem dev classes -q", ":run-shell-command easifem install classes -q --no-download"]
b = ":echo %sh{~/.config/tmux/scripts/buildBase.sh}"
c = ":echo %sh{~/.config/tmux/scripts/buildClasses.sh}"
"+" = [
  "goto_file_end",
  ":append-output ~/.config/helix/scripts/easifemRunTest.sh %{buffer_name}",
]
g = ":sh tmux display-popup -E -w 95%% -h 95%% -d '#{pane_current_path}' lazygit"

[keys.insert]
C-s = [":format", ":write"]
S-tab = "move_parent_node_start"
# related to smart-tab

[keys.select]
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"
"`" = "switch_to_uppercase"
"A-`" = "switch_to_lowercase"
