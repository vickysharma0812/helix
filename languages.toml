use-grammars = { only = [
  "fortran",
  "toml",
  "markdown",
  "scheme",
  "cmake",
  "latex",
  "bibtex",
] }

[language-server]
fortls = { command = "fortls", args = [
  "--nthreads",
  "10",
  "--lowercase_intrinsics",
  "--hover_signature",
  "--hover_language",
  "fortran",
  "--use_signature_help",
  "--incremental_sync",
  "--recursion_limit",
  "1000",
  "--source_dirs",
  "/Users/easifem/Dropbox/easifem/base/src/**",
  "/Users/easifem/Dropbox/easifem/classes/src/**",
  "/Users/easifem/Dropbox/easifem/seepage/src/**",
  "/Users/easifem/Dropbox/easifem/oneDimElasticity/src/**",
  "/Users/easifem/Dropbox/easifem/elasticity/src/**",
  "/Users/easifem/Dropbox/easifem/sdof/src/**",
  "/Users/easifem/.easifem/easifem/src/tomlf/src/**",
] }
zfls = { command = "zfls", args = [
  "--nthreads",
  "10",
  "--lowercase_intrinsics",
  "--hover_signature",
  "--hover_language",
  "fortran",
  "--use_signature_help",
  "--incremental_sync",
  "--recursion_limit",
  "1000",
  "--source_dirs",
  "/Users/easifem/Dropbox/easifem/base/src/**",
  "/Users/easifem/Dropbox/easifem/classes/src/**",
  "/Users/easifem/Dropbox/easifem/seepage/src/**",
  "/Users/easifem/Dropbox/easifem/oneDimElasticity/src/**",
  "/Users/easifem/Dropbox/easifem/elasticity/src/**",
  "/Users/easifem/Dropbox/easifem/sdof/src/**",
  "/Users/easifem/.easifem/easifem/src/tomlf/src/**",
] }
efm = { command = "efm-langserver" }
# cmake-language-server = { command = "cmake-language-server" }
neocmakelsp = { command = "neocmakelsp", args = ["stdio"] }

iwe = { command = "iwes" }

marksman = { command = "marksman", args = ["server"] }

rumdl = { command = "rumdl", args = ["server"] }

vscode-css-language-server = { command = "vscode-css-language-server", args = [
  "--stdio",
], config = { provideFormatter = true, css = { validate = { enable = true } } } }

vscode-html-language-server = { command = "vscode-html-language-server", args = [
  "--stdio",
], config = { provideFormatter = true } }

vscode-json-language-server = { command = "vscode-json-language-server", args = [
  "--stdio",
], config = { provideFormatter = true, json = { validate = { enable = true } } } }


[language-server.fortitude]
command = "fortitude"
args = ["server"]

[language-server.fortitude.config.settings]
linelength = 78
logLevel = "debug"

[language-server.fortitude.config.settings.check]
select = ["C", "S"]
ignore = [
  "superfluous-implicit-none",
  "implicit-external-procedures",
  "interface-implicit-typing",
  "bad-quote-string",
]
preview = false

[language-server.texlab]
command = "texlab"
[language-server.texlab.config.texlab]
build.executable = "latexmk"
build.args = [
  "-pdf",
  "-auxdir=build",
  "-outdir=.",
  "-interaction=nonstopmode",
  "-synctex=1",
  "%f",
]
build.forwardSearchAfter = true
build.onSave = true
forwardSearch.executable = "/Applications/Skim.app/Contents/SharedSupport/displayline"
forwardSearch.args = ["-g", "-r", "%l", "%p", "%f"]
# texlab.latexFormatter = "latexindent"
# texlab.latexindent.local = "latexindent.yaml"

[language-server.digestif]
command = "digestif"

[language-server.scls]
command = "simple-completion-language-server"

[language-server.scls.config]
feature_words = true
feature_snippets = true
snippets_first = true
snippets_inline_by_word_tail = false
feature_unicode_input = false
feature_paths = true
feature_citations = false

[language-server.scls.environment]
RUST_LOG = "info,simple-completion-language-server=info"
LOG_FILE = "/tmp/completion.log"

[[language]]
name = "fortran"
grammar = "fortran"
language-servers = [
  { name = "efm", only-features = [
    "diagnostics",
  ] },
  "zfls",
  # "fortls",
  "scls",
  "fortitude",
]
scope = "source.fortran"
injection-regex = "fortran"
file-types = ["f90", "f95", "f03", "F90"]
comment-token = "!"
indent = { tab-width = 2, unit = "  " }
auto-format = true
roots = ["fpm.toml", ".fortls", ".git", "CMakeLists.txt"]
rulers = [78, 80]
formatter = { command = "fprettify", args = [
  "--case",
  "2",
  "2",
  "2",
  "2",
  "--line-length",
  "78",
  "--indent",
  "2",
  "--strict-indent",
  "--disable-indent-mod",
  "--whitespace",
  "2",
  "--whitespace-comma",
  "--whitespace-assignment",
  "--enable-decl",
  "--whitespace-decl",
  "--whitespace-relational",
  "--whitespace-logical",
  "--whitespace-multdiv",
  "--whitespace-print",
  "--whitespace-intrinsics",
  "--strip-comments",
] }

[[language]]
name = "cmake"
scope = "source.cmake"
file-types = ["cmake", { glob = "CMakeLists.txt" }]
comment-token = "#"
block-comment-tokens = { start = "#[[", end = "]]" }
indent = { tab-width = 2, unit = "  " }
# language-servers = ["neocmakelsp", "cmake-language-server", "scls"]
language-servers = ["neocmakelsp", "scls"]
injection-regex = "cmake"
formatter = { command = "gersemi", args = ["--quiet", "-"] }
auto-format = true

[[language]]
name = "git-commit"
language-servers = ["scls"]

[[language]]
name = "rust"

[[language]]
name = "toml"
scope = "source.toml"
injection-regex = "toml"
auto-format = true
file-types = ["toml"]
comment-token = "#"
language-servers = ["taplo", "tombi"]
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "quarto"
scope = "source.qmd"
language-id = "qmd"
injection-regex = "qmd"
file-types = ["qmd"]
indent = { tab-width = 2, unit = "  " }
grammar = "markdown"
block-comment-tokens = { start = "<!--", end = "-->" }

[[language]]
name = "scheme"

[[language]]
name = "markdown"
scope = "source.md"
soft-wrap.enable = true
auto-format = true
injection-regex = "md|markdown"
file-types = [
  "md",
  "qmd",
  "livemd",
  "markdown",
  "mdx",
  "mkd",
  "mkdn",
  "mdwn",
  "mdown",
  "markdn",
  "mdtxt",
  "mdtext",
  "workbook",
  { glob = "PULLREQ_EDITMSG" },
]
roots = [".marksman.toml"]
language-servers = ["marksman", "scls", "rumdl"]
#language-servers = ["iwe", "marksman", "rumdl"]
indent = { tab-width = 2, unit = "  " }
block-comment-tokens = { start = "<!--", end = "-->" }

[[language]]
name = "markdown.inline"
scope = "source.markdown.inline"
injection-regex = "markdown\\.inline"
file-types = []
grammar = "markdown_inline"

[[language]]
name = "json"

[[language]]
name = "html"

[[language]]
name = "latex"
scope = "source.tex"
injection-regex = "tex"
file-types = ["tex", "dtx", "ins", "sty", "cls", "Rd", "bbx", "cbx"]
comment-token = "%"
# language-servers = ["texlab", "scls"]
language-servers = ["texlab", "digestif", "scls"]
indent = { tab-width = 2, unit = " " }
auto-format = true
# formatter = { command = "latexindent", args = ["-w", "-s"] }

[[language]]
name = "bibtex"
scope = "source.bib"
injection-regex = "bib"
file-types = ["bib"]
comment-token = "%"
language-servers = ["texlab"]
indent = { tab-width = 4, unit = "\t" }
auto-format = true

[language.formatter]
command = 'bibtex-tidy'
args = [
  "-",
  "--curly",
  "--drop-all-caps",
  "--remove-empty-fields",
  "--sort-fields",
  "--sort=year,author,id",
  "--strip-enclosing-braces",
  "--trailing-commas",
]

[[grammar]]
name = "latex"
source = { git = "https://github.com/latex-lsp/tree-sitter-latex", rev = "8c75e93cd08ccb7ce1ccab22c1fbd6360e3bcea6" }

[[grammar]]
name = "bibtex"
source = { git = "https://github.com/latex-lsp/tree-sitter-bibtex", rev = "8d04ed27b3bc7929f14b7df9236797dab9f3fa66" }

[[grammar]]
name = "fortran"
source = { git = "https://github.com/vickysharma0812/tree-sitter-fortran", rev = "3f5f2e338b5edc17b01b64670ba11ded30798053" }

[[grammar]]
name = "cmake"
source = { git = "https://github.com/uyha/tree-sitter-cmake", rev = "c7b2a71e7f8ecb167fad4c97227c838439280175" }

[[grammar]]
name = "markdown"
source = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", rev = "62516e8c78380e3b51d5b55727995d2c511436d8", subpath = "tree-sitter-markdown" }

[[grammar]]
name = "markdown_inline"
source = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", rev = "62516e8c78380e3b51d5b55727995d2c511436d8", subpath = "tree-sitter-markdown-inline" }
